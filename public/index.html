<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10274b"><link rel="manifest" href="/manifest.webmanifest"><title>SH AI 탐정사무소</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#172d4d;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}header{background:#10274b;color:white;padding:22px 18px}header small{color:#a7d8ff}main{max-width:900px;margin:auto;padding:18px}.card{background:white;border:1px solid #e0e8f2;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 5px 20px #122d5010}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}button,select,input{font:inherit;border-radius:10px;padding:12px 14px}button{background:#1769d2;color:white;border:0;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#eaf1fc;color:#163c70}button:disabled{background:#adb7c6}select,input{border:1px solid #aebed2;width:100%;margin:10px 0;padding:12px;border-radius:10px}.muted{color:#5f7189}.options label{display:block;padding:12px;margin:9px 0;border:1px solid #cbd9e9;border-radius:10px}.options input{margin-right:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.tile{background:#f1f6fe;border-radius:12px;padding:14px}.ok{color:#087e57}.warn{color:#a25b0b}.hidden{display:none}.bar{height:9px;background:#d9e4f3;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#1769d2}a{color:#1769d2}footer{text-align:center;color:#6c7c90;padding:30px}
</style></head><body><header><small>SH에듀컴퍼니 · 청소년 체험교육</small><h1>🕵️ SH AI 탐정사무소</h1><div>6개의 미션 · 40개 팀 · 실시간 현황</div></header><main><section id="home" class="card"><h2>접속하기</h2><p class="muted">학생은 팀 번호를 선택하세요. 관리자는 관리자 화면으로 이동하세요.</p><button onclick="show('student')">학생용 시작</button><button class="secondary" onclick="show('admin')">관리자 화면</button></section><section id="student" class="hidden"><div class="card" id="join"><h2>우리 팀 선택</h2><select id="team"><option value="">팀 번호 선택</option></select><button onclick="join()">미션 시작</button><input id="eventcode" placeholder="행사 참가코드 (안내받은 경우 입력)" autocomplete="off"><p class="muted">같은 팀 번호로 접속하면 팀의 진행 결과가 공유됩니다.</p></div><div id="play" class="hidden"><div class="card"><h2 id="teamtitle"></h2><div id="status"></div><button class="secondary" onclick="show('home')">처음으로</button></div><div id="missionlist"></div></div></section><section id="admin" class="hidden"><div class="card"><h2>관리자 대시보드</h2><div id="admincontrols"><button onclick="exportData()">결과 저장</button><button class="secondary" onclick="resetAll()">전체 초기화</button></div><div id="summary"></div><button onclick="refresh()">새로고침</button><button class="secondary" onclick="show('home')">처음으로</button></div><div id="board" class="grid"></div></section></main><footer>SH에듀컴퍼니 | AI 탐정사무소</footer><script>
let missions=[],teamNum=null,teamData=null,all={},code='',loggedIn=true;for(let i=1;i<=40;i++)document.getElementById('team').add(new Option(`${i}팀`,i));
function show(id){for(const x of ['home','student','admin'])document.getElementById(x).classList.toggle('hidden',x!==id);if(id==='admin')refresh();scrollTo(0,0)}
async function request(url,options){let r=await fetch(url,options);let j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function join(){try{teamNum=Number(document.getElementById('team').value);code=document.getElementById('eventcode').value.trim();teamData=await request('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team:teamNum,code})});missions=await request('/api/missions');document.getElementById('join').classList.add('hidden');document.getElementById('play').classList.remove('hidden');renderStudent()}catch(e){alert(e.message)}}
function renderStudent(){if(!teamData)return;let done=Object.keys(teamData.answers).length;document.getElementById('teamtitle').textContent=`${teamNum}팀 탐정단`;document.getElementById('status').innerHTML=`<p>완료 ${done}/6 · 점수 ${teamData.score}/600점</p><div class="bar"><span style="width:${done/6*100}%"></span></div>`;document.getElementById('missionlist').innerHTML=missions.map(m=>{let answered=teamData.answers[m.id]!==undefined;return `<div class="card"><h2>미션 ${m.id}. ${m.title}</h2><p>${m.story}</p>${answered?'<p class="ok">✓ 제출 완료</p>':`<div class="options">${m.options.map((o,i)=>`<label><input type="radio" name="m${m.id}" value="${i}">${o}</label>`).join('')}</div><button onclick="submit(${m.id})">정답 제출</button>`}</div>`}).join('')}
async function submit(m){let checked=document.querySelector(`input[name=m${m}]:checked`);if(!checked){alert('답을 선택하세요');return}try{let r=await request('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team:teamNum,code,mission:m,answer:Number(checked.value)})});teamData=r.team;alert((r.correct?'정답! +100점':'아쉽지만 오답입니다.')+'\n'+r.explanation);renderStudent()}catch(e){alert(e.message);await refresh()}}
async function refresh(){try{all=await request('/api/teams');renderAdmin()}catch(e){document.getElementById('summary').textContent='현황을 불러오지 못했습니다: '+e.message}}
function renderAdmin(){let arr=Array.from({length:40},(_,i)=>({n:i+1,...(all[i+1]||{answers:{},score:0})}));let started=arr.filter(t=>Object.keys(t.answers).length).length;document.getElementById('summary').textContent=`진행 팀 ${started}/40 · 완료 팀 ${arr.filter(t=>Object.keys(t.answers).length===6).length}/40`;document.getElementById('board').innerHTML=arr.map(t=>{let d=Object.keys(t.answers).length;return `<div class="tile"><strong>${t.n}팀</strong><p>${d}/6 미션 · ${t.score}점</p><div class="bar"><span style="width:${d/6*100}%"></span></div></div>`}).join('')}
function exportData(){location.href='/api/admin/export'}
async function resetAll(){if(prompt('전체 기록을 삭제하려면 전체초기화 를 입력하세요')!=='전체초기화')return;await request('/api/admin/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'전체초기화'})});refresh()}
setInterval(async()=>{if(loggedIn)await refresh();if(teamNum&&teamData){try{teamData=await request('/api/team?team='+teamNum+'&code='+encodeURIComponent(code));renderStudent()}catch{}}},5000);show('home');
</script></body></html>
